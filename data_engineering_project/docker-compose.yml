# Data Engineering End-to-End Project
# Random User API -> Airflow -> Kafka (3 brokers) -> Spark Structured Streaming -> Cassandra
# All services share the same default Docker network, so they can reach each other by name
# (kafka1, cassandra, ...).

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.5.3
  depends_on:
    - zoo1
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- Kafka cluster
  zoo1:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zoo1:2888:3888

  kafka1:
    <<: *kafka-common
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zoo1:2181
      # INTERNAL = used by containers (Airflow, Spark), EXTERNAL = used from your Mac
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  kafka2:
    <<: *kafka-common
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zoo1:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:19093,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  kafka3:
    <<: *kafka-common
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zoo1:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:19094,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8888:8080"          # open http://localhost:8888
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19092,kafka2:19093,kafka3:19094
      DYNAMIC_CONFIG_ENABLED: "true"

  # ---------------------------------------------------------------- Cassandra
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - ./cassandra:/scripts
      - cassandra-data:/var/lib/cassandra

  # ---------------------------------------------------------------- Spark
  spark:
    image: apache/spark:3.5.3
    container_name: spark_master
    command: tail -f /dev/null   # keep the container running; we launch jobs with spark-submit
    volumes:
      - ./spark:/opt/spark-apps

  # ---------------------------------------------------------------- Airflow
  airflow:
    image: apache/airflow:2.10.3
    container_name: airflow
    ports:
      - "8080:8080"          # open http://localhost:8080  (user: admin / password: admin)
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "kafka-python>=2.0.3 requests"
    volumes:
      - ./dags:/opt/airflow/dags
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --password admin --firstname Admin
                 --lastname User --role Admin --email admin@example.com || true) &&
               airflow standalone"
    depends_on:
      - kafka1
      - kafka2
      - kafka3

volumes:
  cassandra-data:
